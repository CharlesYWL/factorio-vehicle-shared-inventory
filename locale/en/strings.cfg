[mod-setting-description]
vsi-enabled=Feed construction materials from your inventory into the vehicle you are riding.
vsi-share-robots=Also lend construction robots from your inventory, up to the vehicle roboport capacity. Only happens when there is work nearby. Best quality first.
vsi-interval=How often the mod checks for missing materials. Higher values cost less UPS.
vsi-return-on-exit=Items this mod moved into the trunk are moved back when you leave. The vehicle's own stock is never taken.
vsi-require-roboport=Only share when the vehicle has a powered roboport equipment. Turn off to always share.
vsi-max-ghosts=Above this count, only the nearest ghosts are considered in a single pass.

[string-mod-setting]
