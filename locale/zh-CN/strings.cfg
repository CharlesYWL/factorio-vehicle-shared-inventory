[mod-setting-name]
vsi-enabled=启用背包共享
vsi-share-robots=共享建造机器人
vsi-interval=更新间隔（tick）
vsi-return-on-exit=离开载具时归还借出物品
vsi-return-overflow=后备箱将满时回收物品
vsi-overflow-threshold=后备箱剩余空间阈值（%）
vsi-require-roboport=要求载具装有机器人站
vsi-vehicle-types=支持的载具
vsi-max-ghosts=单次扫描幽灵上限

[mod-setting-description]
vsi-enabled=乘坐载具时，自动把建造所需材料从玩家背包送入载具后备箱。
vsi-share-robots=同时把背包里的建造机器人借给载具，补到载具机器人站容量上限。仅在附近有建造任务时触发，优先借高品质的。
vsi-interval=检查缺料的频率。数值越大越省 UPS。
vsi-return-on-exit=离开载具时，把本模组搬入的物品送回背包。载具原有物资永远不会被拿走。
vsi-return-overflow=后备箱空间不足时，把拆除所得搬回玩家背包，避免机器人因装不下而停工。只回收你背包里已有的品类；弹药、燃料与机器人永不回收。
vsi-overflow-threshold=后备箱空格低于该百分比时开始回收。
vsi-require-roboport=仅在载具装有通电的机器人站插件时共享。关闭则始终共享。
vsi-max-ghosts=超过该数量时，单次只处理距离最近的幽灵。

[string-mod-setting]
vsi-vehicle-types-spider=仅蜘蛛机甲
vsi-vehicle-types-spider-and-car=蜘蛛机甲、汽车与坦克

[vsi]
trunk-full=载具后备箱已满
